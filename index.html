<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>گاه‌شمار ریحانه گرانسایه</title>
<meta name="description" content="گاه‌شمار تحصیلی-کاری ریحانه گرانسایه، دانشجوی کارشناسی ارشد ژورنالیسم پزشکی دانشگاه علوم پزشکی ایران">
<meta property="og:title" content="گاه‌شمار تحصیلی-کاری ریحانه گرانسایه">
<meta property="og:description" content="رزومه ورق‌زن: سوابق تحصیلی، پژوهشی و کاری">
<link rel="icon" type="image/png" href="favicon.png">
<style>
@font-face { font-family: "Vazirmatn"; src: url("Vazirmatn-FD-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Vazirmatn"; src: url("Vazirmatn-FD-Medium.ttf") format("truetype"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Vazirmatn"; src: url("Vazirmatn-FD-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
@font-face { font-family: "Vazirmatn"; src: url("Vazirmatn-FD-ExtraBold.ttf") format("truetype"); font-weight: 800; font-display: swap; }
:root {
  /* A reading room for one RTL booklet: light stage, navy-teal book, gold accents. Single theme by design. */
  --stage: #E6ECEE;
  --stage-2: #D5DFE3;
  --ink: #12283B;
  --muted: #5A6B77;
  --teal: #15807A;
  --gold: #C9963F;
  --panel: rgba(255, 255, 255, .78);
  --font: "Vazirmatn", "Tahoma", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font); color: var(--ink); overflow: hidden;
  background:
    radial-gradient(1200px 700px at 50% 38%, #F4F7F8 0%, transparent 70%),
    linear-gradient(180deg, var(--stage), var(--stage-2));
  display: flex; flex-direction: column;
}
header { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 22px 4px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: 0; text-wrap: balance; }
.brand span { font-size: 13px; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); }
main { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; }
.stage { position: relative; direction: ltr; perspective: 2600px; }
.book { position: relative; transition: transform .7s cubic-bezier(.645,.045,.355,1); transform-style: preserve-3d; }
.leaf { position: absolute; top: 0; left: 0; transform-origin: 100% 50%; transform-style: preserve-3d;
  transition: transform .95s cubic-bezier(.645,.045,.355,1); cursor: pointer; }
.leaf.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden;
  background: #fff; box-shadow: 0 14px 34px rgba(18, 40, 59, .22), 0 2px 6px rgba(18, 40, 59, .12); }
.face img { width: 100%; height: 100%; display: block; object-fit: cover; user-select: none; -webkit-user-drag: none; }
.face.back { transform: rotateY(180deg); }
.face::after { content: ""; position: absolute; top: 0; bottom: 0; width: 9%; pointer-events: none; }
.face.front::after { right: 0; background: linear-gradient(to left, rgba(0,0,0,.20), rgba(0,0,0,.05) 40%, transparent); }
.face.back::after { left: 0; background: linear-gradient(to right, rgba(0,0,0,.20), rgba(0,0,0,.05) 40%, transparent); }
.face .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.0), rgba(0,0,0,.28)); opacity: 0; pointer-events: none; }
.leaf.turning .shade { animation: shade .95s ease-in-out; }
@keyframes shade { 0% { opacity: 0 } 50% { opacity: 1 } 100% { opacity: 0 } }
/* single page mode for narrow screens */
.single { position: relative; direction: ltr; perspective: 2000px; }
.single .face { position: absolute; inset: 0; }
.single .turn { position: absolute; inset: 0; transform-origin: 100% 50%; backface-visibility: hidden; z-index: 3; }
.single .turn.out { animation: out .6s cubic-bezier(.645,.045,.355,1) forwards; }
.single .turn.in { animation: in .6s cubic-bezier(.645,.045,.355,1) forwards; }
@keyframes out { to { transform: rotateY(110deg); opacity: .0; } }
@keyframes in { from { transform: rotateY(110deg); opacity: 0; } to { transform: rotateY(0); opacity: 1; } }
.toolbar { flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 16px 6px; flex-wrap: wrap; }
.btn { text-decoration: none; font-family: var(--font); font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid rgba(18,40,59,.14);
  border-radius: 999px; height: 40px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  backdrop-filter: blur(6px); transition: background .2s, border-color .2s, transform .1s; }
.btn:hover { background: #fff; border-color: rgba(21,128,122,.45); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, .thumb:focus-visible { outline: 2.5px solid var(--teal); outline-offset: 2px; }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.primary:hover { background: #1b3a52; }
.status { min-width: 150px; text-align: center; font-size: 14px; font-weight: 500; color: var(--ink); }
.status small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 400; }
.sep { width: 1px; height: 24px; background: rgba(18,40,59,.15); margin: 0 4px; }
.rail { flex: none; display: flex; gap: 8px; justify-content: center; padding: 6px 16px 14px; overflow-x: auto; scrollbar-width: thin; }
.thumb { flex: none; width: 40px; height: 57px; border-radius: 4px; overflow: hidden; border: 2px solid transparent; padding: 0; background: #fff;
  cursor: pointer; opacity: .62; transition: opacity .2s, border-color .2s, transform .2s; box-shadow: 0 2px 6px rgba(18,40,59,.18); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb:hover { opacity: .95; transform: translateY(-2px); }
.thumb.on { opacity: 1; border-color: var(--gold); }
.lightbox { position: fixed; inset: 0; background: rgba(9, 20, 31, .92); z-index: 50; display: none; flex-direction: column; }
.lightbox.open { display: flex; }
.lb-bar { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; color: #E7F0F2; font-size: 14px; }
.lb-bar .btn { background: rgba(255,255,255,.1); color: #fff; border-color: rgba(255,255,255,.25); }
.lb-body { flex: 1; overflow: auto; display: flex; gap: 14px; justify-content: center; align-items: flex-start; padding: 0 16px 24px; flex-wrap: wrap; }
.lb-body img { width: min(100%, 900px); height: auto; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
@media (max-width: 760px) {
  header { padding: 12px 16px 2px; }
  .hint { display: none; }
  .brand h1 { font-size: 16px; }
  .btn .lbl { display: none; }
  .btn { padding: 0 12px; }
  #full, .sep { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .leaf, .book { transition: none; }
  .leaf.turning .shade { animation: none; }
  .single .turn.out, .single .turn.in { animation-duration: 1ms; }
}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>گاه‌شمار تحصیلی-کاری</h1><span>ریحانه گرانسایه</span></div>
  <div class="hint">برای ورق زدن روی صفحه‌ها کلیک کنید یا از کلیدهای جهت‌نما استفاده کنید</div>
</header>
<main id="main" aria-label="کتابچه رزومه">
  <div class="stage" id="stage"><div class="book" id="book"></div></div>
  <div class="single" id="single" hidden></div>
</main>
<nav class="toolbar" aria-label="ورق زدن">
  <button class="btn" id="prev" type="button" aria-label="صفحه قبل"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg><span class="lbl">قبلی</span></button>
  <div class="status" id="status" aria-live="polite"></div>
  <button class="btn primary" id="next" type="button" aria-label="صفحه بعد"><span class="lbl">بعدی</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
  <span class="sep" aria-hidden="true"></span>
  <button class="btn" id="zoom" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="M21 21l-6-6M10 7v6M7 10h6"/></svg><span class="lbl">بزرگ‌نمایی</span></button>
  <a class="btn" id="pdf" href="Gahshomar-Reyhaneh-Gransayeh.pdf" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="lbl">دریافت PDF</span></a>
  <button class="btn" id="full" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="lbl">تمام‌صفحه</span></button>
</nav>
<div class="rail" id="rail" role="tablist" aria-label="صفحه‌ها"></div>
<div class="lightbox" id="lb" role="dialog" aria-modal="true" aria-label="نمای بزرگ صفحه">
  <div class="lb-bar"><span id="lbTitle"></span><button class="btn" id="lbClose" type="button">بستن</button></div>
  <div class="lb-body" id="lbBody"></div>
</div>
<script>
(function () {
  var FA = "۰۱۲۳۴۵۶۷۸۹";
  function fa(n) { return String(n).replace(/[0-9]/g, function (d) { return FA[d]; }); }
  var names = ["جلد", "آستر بدرقه", "فهرست و گاه‌شمار", "رزومه، صفحه ۱", "رزومه، صفحه ۲", "رزومه، صفحه ۳", "رزومه، صفحه ۴",
    "رزومه، صفحه ۵", "رزومه، صفحه ۶", "رزومه، صفحه ۷", "راه‌های ارتباط", "پشت جلد"];
  var TOTAL = names.length, LEAVES = TOTAL / 2, RATIO = 1980 / 1400;
  function src(i) { return "p" + (i < 10 ? "0" : "") + i + ".jpg"; }
  var book = document.getElementById("book"), stage = document.getElementById("stage"), single = document.getElementById("single");
  var statusEl = document.getElementById("status"), rail = document.getElementById("rail");
  var prevBtn = document.getElementById("prev"), nextBtn = document.getElementById("next");
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var n = 0;        // leaves turned in spread mode (0 = closed on the front cover)
  var face = 1;     // face shown in single-page mode
  var mode = null, pw = 0, ph = 0, busy = false;

  for (var i = 1; i <= TOTAL; i++) { var im = new Image(); im.src = src(i); }

  // spread mode: leaf k carries faces 2k+1 (front) and 2k+2 (back)
  var leaves = [];
  function faceEl(i, side) {
    var d = document.createElement("div");
    d.className = "face " + side;
    d.innerHTML = '<img alt="' + names[i - 1] + '" src="' + src(i) + '" draggable="false"><div class="shade"></div>';
    return d;
  }
  for (var k = 0; k < LEAVES; k++) {
    var leaf = document.createElement("div");
    leaf.className = "leaf";
    leaf.appendChild(faceEl(2 * k + 1, "front"));
    leaf.appendChild(faceEl(2 * k + 2, "back"));
    book.appendChild(leaf);
    leaves.push(leaf);
  }
  // thumbnails, right to left in reading order
  var thumbs = [];
  for (var t = 1; t <= TOTAL; t++) {
    (function (i) {
      var b = document.createElement("button");
      b.className = "thumb"; b.type = "button"; b.setAttribute("role", "tab");
      b.setAttribute("aria-label", names[i - 1]); b.title = names[i - 1];
      b.innerHTML = '<img alt="" loading="lazy" src="' + src(i) + '">';
      b.addEventListener("click", function () { goFace(i); });
      rail.appendChild(b); thumbs.push(b);
    })(t);
  }

  function visibleFaces() {
    if (mode === "single") return [face];
    if (n === 0) return [1];
    if (n === LEAVES) return [TOTAL];
    return [2 * n, 2 * n + 1];
  }
  function updateUI() {
    var vf = visibleFaces();
    if (mode === "single") {
      statusEl.innerHTML = "صفحه " + fa(face) + " از " + fa(TOTAL) + "<small>" + names[face - 1] + "</small>";
      prevBtn.disabled = face === 1; nextBtn.disabled = face === TOTAL;
    } else {
      var label = vf.length === 1 ? names[vf[0] - 1] : names[vf[0] - 1] + " و " + names[vf[1] - 1].replace("رزومه، ", "");
      statusEl.innerHTML = (vf.length === 1 ? "صفحه " + fa(vf[0]) : "صفحه " + fa(vf[0]) + " و " + fa(vf[1])) + " از " + fa(TOTAL) + "<small>" + label + "</small>";
      prevBtn.disabled = n === 0; nextBtn.disabled = n === LEAVES;
    }
    thumbs.forEach(function (b, idx) { var on = vf.indexOf(idx + 1) >= 0; b.classList.toggle("on", on); b.setAttribute("aria-selected", on ? "true" : "false"); });
    var active = thumbs[vf[0] - 1];
    if (active && active.scrollIntoView) { try { active.scrollIntoView({ block: "nearest", inline: "center", behavior: reduce ? "auto" : "smooth" }); } catch (e) {} }
  }
  function layoutSpread() {
    book.style.width = 2 * pw + "px"; book.style.height = ph + "px";
    stage.style.width = 2 * pw + "px"; stage.style.height = ph + "px";
    leaves.forEach(function (lf, k) {
      lf.style.width = pw + "px"; lf.style.height = ph + "px";
      lf.classList.toggle("flipped", k < n);
      lf.style.zIndex = k < n ? 10 + k : 100 - k;
    });
    var shift = n === 0 ? pw / 2 : (n === LEAVES ? -pw / 2 : 0);
    book.style.transform = "translateX(" + shift + "px)";
  }
  function turnTo(target) {
    target = Math.max(0, Math.min(LEAVES, target));
    if (target === n || busy) return;
    var forward = target > n;
    var moving = forward ? leaves[n] : leaves[n - 1];
    var steps = Math.abs(target - n);
    if (steps > 1 || reduce) { n = target; layoutSpread(); updateUI(); return; }
    busy = true;
    moving.style.zIndex = 300;
    moving.classList.add("turning");
    n = target;
    requestAnimationFrame(function () {
      moving.classList.toggle("flipped", forward);
      var shift = n === 0 ? pw / 2 : (n === LEAVES ? -pw / 2 : 0);
      book.style.transform = "translateX(" + shift + "px)";
      updateUI();
    });
    setTimeout(function () { moving.classList.remove("turning"); layoutSpread(); busy = false; }, 980);
  }
  // single mode
  function renderSingle(prevFace, dir) {
    single.style.width = pw + "px"; single.style.height = ph + "px";
    var html = '<div class="face front"><img alt="' + names[face - 1] + '" src="' + src(face) + '" draggable="false"></div>';
    if (dir && !reduce) {
      if (dir > 0) html += '<div class="turn out"><div class="face front"><img alt="" src="' + src(prevFace) + '"></div></div>';
      else html = '<div class="face front"><img alt="" src="' + src(prevFace) + '"></div><div class="turn in"><div class="face front"><img alt="' + names[face - 1] + '" src="' + src(face) + '"></div></div>';
    }
    single.innerHTML = html;
  }
  function singleTo(target) {
    target = Math.max(1, Math.min(TOTAL, target));
    if (target === face) return;
    var p = face, dir = target > face ? 1 : -1;
    face = target;
    renderSingle(p, Math.abs(target - p) === 1 ? dir : 0);
    updateUI();
  }
  function next() { mode === "single" ? singleTo(face + 1) : turnTo(n + 1); }
  function prev() { mode === "single" ? singleTo(face - 1) : turnTo(n - 1); }
  function goFace(i) {
    if (mode === "single") { singleTo(i); return; }
    turnTo(i === 1 ? 0 : (i === TOTAL ? LEAVES : Math.floor(i / 2)));
  }
  function fit() {
    var main = document.getElementById("main");
    var W = main.clientWidth - 32, H = main.clientHeight - 16;
    var newMode = (window.innerWidth < 760 || W / 2 < 250) ? "single" : "spread";
    if (newMode !== mode && mode !== null) {
      if (newMode === "single") face = visibleFaces()[mode === "spread" && n > 0 && n < LEAVES ? 0 : 0];
      else n = face === 1 ? 0 : (face === TOTAL ? LEAVES : Math.floor(face / 2));
    }
    mode = newMode;
    if (mode === "single") {
      pw = Math.floor(Math.min(W, H / RATIO)); ph = Math.floor(pw * RATIO);
      stage.hidden = true; single.hidden = false; renderSingle();
    } else {
      pw = Math.floor(Math.min(W / 2, H / RATIO)); ph = Math.floor(pw * RATIO);
      stage.hidden = false; single.hidden = true; layoutSpread();
    }
    updateUI();
  }

  // input
  stage.addEventListener("click", function (e) {
    var r = stage.getBoundingClientRect(), x = e.clientX - r.left;
    if (n === 0) { next(); return; }
    if (n === LEAVES) { prev(); return; }
    if (x < r.width / 2) next(); else prev();
  });
  single.addEventListener("click", function (e) {
    var r = single.getBoundingClientRect();
    if (e.clientX - r.left < r.width / 2) next(); else prev();
  });
  var tx = null;
  document.getElementById("main").addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; }, { passive: true });
  document.getElementById("main").addEventListener("touchend", function (e) {
    if (tx === null) return;
    var dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 40) { dx > 0 ? next() : prev(); }
  });
  prevBtn.addEventListener("click", prev);
  nextBtn.addEventListener("click", next);
  var lb = document.getElementById("lb"), lbBody = document.getElementById("lbBody");
  function openLb() {
    var vf = visibleFaces();
    lbBody.innerHTML = vf.map(function (i) { return '<img alt="' + names[i - 1] + '" src="' + src(i) + '">'; }).join("");
    document.getElementById("lbTitle").textContent = vf.map(function (i) { return names[i - 1]; }).join(" و ");
    lb.classList.add("open"); document.getElementById("lbClose").focus();
  }
  function closeLb() { lb.classList.remove("open"); document.getElementById("zoom").focus(); }
  document.getElementById("zoom").addEventListener("click", openLb);
  document.getElementById("lbClose").addEventListener("click", closeLb);
  document.getElementById("full").addEventListener("click", function () {
    try {
      if (document.fullscreenElement) { document.exitFullscreen(); }
      else { var p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(function () {}); }
    } catch (e) {}
  });
  document.addEventListener("keydown", function (e) {
    if (lb.classList.contains("open")) { if (e.key === "Escape") closeLb(); return; }
    if (e.key === "ArrowLeft" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
    else if (e.key === "ArrowRight" || e.key === "PageUp") { e.preventDefault(); prev(); }
    else if (e.key === "Home") { goFace(1); }
    else if (e.key === "End") { goFace(TOTAL); }
  });
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(fit, 80); });
  fit();
})();
</script>
</body>
</html>
